services:
  debian:
    build: .
    volumes:
      # Live source, read-only: edit on the host, re-apply in the container.
      # chezmoi never writes into its source (state lives in ~/.config/chezmoi),
      # so read-only is safe and keeps the container off your working tree.
      - .:/workspace:ro
    working_dir: /home/dev
    # Uncomment to skip the env/class prompts (git identity then falls back to
    # chezmoi's prompt defaults).
    # environment:
    #   DOTFILES_ENV: personal
    #   DOTFILES_CLASS: personal-server
    stdin_open: true # docker compose run/exec -i
    tty: true
    # Bootstrap + login zsh:  docker compose exec debian dotfiles-test
    # Plain shell, no apply:  docker compose exec debian zsh
    # The image CMD (sleep infinity) keeps the container alive for `exec`.
